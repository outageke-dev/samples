<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0e13">
  <title>OutageKE | Amp Solar Ad Sample</title>
  <style>
    * { box-sizing: border-box; }
    html, body, iframe { width:100%; height:100%; margin:0; border:0; display:block; }
    body { overflow:hidden; background:#0c0e13; }
  </style>
</head>
<body>
  <iframe id="outagekePreview" src="../index.html?sample_ads=amp_solar" title="OutageKE homepage with Amp Solar advertising sample"></iframe>
  <script>
    (() => {
      const frame = document.getElementById("outagekePreview");
      const imageUrl = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTlopn15pfZJ63sTQXrzBmnhy1S7nYFXdTSc8mHW-FjnQ&s=10";
      const ampUrl = "https://ampsolar.co.ke/?utm_source=outageke&utm_medium=display&utm_campaign=amp_solar_sample";

      const style = `<style id="ampSolarSampleStyles">
        .amp-sample-header { background:#101914 !important; border-color:rgba(126,184,130,.32) !important; }
        .amp-sample-header .plexus-header-photo { object-fit:contain !important; padding:24px !important; background:#f4f6f0 !important; }
        .amp-sample-header .plexus-header-content { gap:10px !important; }
        .amp-sample-header .plexus-header-label,.amp-sample-feed .plexus-infeed-sponsor { color:#a9dc72 !important; }
        .amp-sample-header .plexus-header-title { color:#f3f6f1 !important; }
        .amp-sample-header .plexus-header-description { color:#c0c9be !important; }
        .amp-sample-header .plexus-header-cta { display:inline-flex; padding:10px 14px; border-radius:6px; background:#a9dc72; color:#162616 !important; }
        .amp-sample-feed { background:#101914 !important; border-color:rgba(126,184,130,.32) !important; }
        .amp-sample-feed .plexus-infeed-image { object-fit:contain !important; padding:18px !important; background:#f4f6f0 !important; }
        .amp-sample-feed .plexus-infeed-headline { color:#f3f6f1 !important; }
        .amp-sample-feed .plexus-infeed-description { color:#c0c9be !important; }
        .amp-sample-feed .plexus-infeed-cta { display:inline-flex; padding:8px 12px; border-radius:5px; background:#a9dc72; color:#162616 !important; }
        .amp-sample-chat { max-width:min(88%,420px); margin:10px auto 10px 0; cursor:pointer; }
        .amp-sample-chat .sc-comm-bubble { border:1px solid rgba(126,184,130,.34) !important; background:#19251f !important; }
        .amp-sample-chat .sc-comm-ad-label { color:#a9dc72 !important; }
        .amp-sample-chat .sc-comm-ad-image-link img { display:block; width:100%; max-height:180px; object-fit:contain; background:#f4f6f0; }
        .amp-sample-chat .sc-comm-ad-headline { color:#f3f6f1; }
        .amp-sample-chat .sc-comm-ad-description { color:#c0c9be; }
        .amp-sample-chat .sc-comm-ad-cta { color:#a9dc72 !important; }
        .sample-seed-group .card-secondary-actions-row { position:relative; padding-top:34px !important; }
        .amp-discussion-pointer { position:absolute; top:0; right:0; z-index:3; padding:5px 9px; border-radius:5px; background:#a9dc72; color:#162616; font:700 10px/1.2 var(--sans); white-space:nowrap; box-shadow:0 3px 10px rgba(0,0,0,.28); }
        .amp-discussion-pointer::after { content:""; position:absolute; right:20px; top:100%; border:6px solid transparent; border-top-color:#a9dc72; }
        .sample-seed-group > .alert-group-heading span::after { content:" · SAMPLE PREVIEW"; color:var(--accent); }
        html.ads-suppressed #directAdSlot.plexus-header-slot, body.supporter-active #directAdSlot.plexus-header-slot { display:block !important; }
        html.ads-suppressed .ad-slot-in-feed.plexus-infeed-slot, body.supporter-active .ad-slot-in-feed.plexus-infeed-slot { display:block !important; }
        @media(max-width:600px) { .amp-sample-header .plexus-header-photo { height:150px !important; min-height:150px !important; padding:14px !important; } }
      </style>`;

      const headerMarkup = `<a class="plexus-header-ad amp-sample-header" href="${ampUrl}" target="_blank" rel="sponsored noopener noreferrer" aria-label="Sponsored by Amp Solar Solutions">
        <img class="plexus-header-photo" src="${imageUrl}" alt="Amp Solar Solutions solar campaign" loading="eager">
        <div class="plexus-header-content">
          <span class="plexus-header-label">Sponsored · Amp Solar Solutions</span>
          <strong class="plexus-header-title">Power through outages with solar backup.</strong>
          <span class="plexus-header-description">Solar and battery systems for homes and businesses across Kenya.</span>
          <span class="plexus-header-cta">Get a free solar assessment <span aria-hidden="true">→</span></span>
        </div>
      </a>`;
      const feedMarkup = `<a class="plexus-infeed-ad amp-sample-feed" href="${ampUrl}&utm_content=in_feed" target="_blank" rel="sponsored noopener noreferrer" aria-label="Sponsored by Amp Solar Solutions">
        <img class="plexus-infeed-image" src="${imageUrl}" alt="Amp Solar Solutions solar campaign" loading="lazy">
        <div class="plexus-infeed-copy">
          <span class="plexus-infeed-sponsor">Sponsored · Amp Solar Solutions</span>
          <strong class="plexus-infeed-headline">Stay powered when the grid goes down.</strong>
          <span class="plexus-infeed-description">Explore solar backup options for your home or business.</span>
          <span class="plexus-infeed-cta">Get a free solar assessment <span aria-hidden="true">→</span></span>
        </div>
      </a>`;
      const chatMarkup = `<article class="sc-comm-msg is-incoming sc-comm-sponsored-msg amp-sample-chat" data-alert-chat-ad="amp-solar-sample" role="link" tabindex="0" aria-label="Sponsored message from Amp Solar Solutions">
        <div class="sc-comm-bubble-wrapper"><div class="sc-comm-bubble">
          <div class="sc-comm-sender"><span class="sc-comm-sender-name">Amp Solar Solutions</span><span class="sc-comm-ad-label">Sponsored</span></div>
          <a class="sc-comm-ad-image-link" href="${ampUrl}&utm_content=community_chat" target="_blank" rel="sponsored noopener noreferrer"><img src="${imageUrl}" alt="Amp Solar Solutions solar campaign" loading="lazy"></a>
          <strong class="sc-comm-ad-headline">Keep your home powered when the grid goes down.</strong>
          <div class="sc-comm-ad-description">Solar and battery backup options for homes and businesses across Kenya.</div>
          <div class="sc-comm-ad-footer"><span class="sc-comm-time-meta">Partner message</span><a class="sc-comm-ad-cta" href="${ampUrl}&utm_content=community_chat" target="_blank" rel="sponsored noopener noreferrer">Get a free solar assessment →</a></div>
        </div></div>
      </article>`;

      const seedAlerts = () => {
        const win = frame.contentWindow;
        if (typeof win.buildCard !== "function") return null;
        const now = new Date().toISOString();
        return [
          ["power", "unplanned", "Kilimani, Nairobi", "Nairobi", "Community members report a power interruption around Kilimani. Restoration time has not been confirmed."],
          ["power", "planned", "Ruaka and Banana Hill", "Kiambu", "Scheduled maintenance may affect parts of Ruaka and Banana Hill today."],
          ["water", "unplanned", "Nyali, Mombasa", "Mombasa", "Residents report low water pressure in parts of Nyali while supply is checked."],
          ["power", "unplanned", "Milimani, Nakuru", "Nakuru", "A local interruption is affecting customers around Milimani."],
          ["internet", "unplanned", "Westlands, Nairobi", "Nairobi", "Customers report intermittent home internet service in parts of Westlands."],
          ["power", "planned", "Thika Road corridor", "Kiambu", "Planned works may interrupt supply near parts of the Thika Road corridor."],
          ["water", "unplanned", "Kisumu Central", "Kisumu", "Water supply is reported interrupted around Kisumu Central."]
        ].map(([type,outageType,location,county,summary],index) => ({
          id:`amp-sample-seed-${index+1}`, alert_hash:`amp-sample-seed-${index+1}`,
          alert_type:type, utility_type:type === "power" ? "electricity" : type,
          outage_type:outageType, source:outageType === "planned" ? "Kenya Power (sample notice)" : "OutageKE Report (sample)",
          location, county, region:county, summary, clean_text:summary, message:summary,
          effective_start:now, posted_at:now, is_sample_preview_seed:true
        }));
      };

      const applySampleAds = () => {
        const doc = frame.contentDocument;
        if (!doc || !doc.body) return;
        if (!doc.getElementById("ampSolarSampleStyles")) doc.head.insertAdjacentHTML("beforeend", style);

        const headerSlot = doc.getElementById("directAdSlot");
        const headerContent = doc.getElementById("directAdContent");
        if (headerSlot && headerContent && !headerContent.querySelector(".amp-sample-header")) {
          headerSlot.hidden = false;
          headerSlot.style.display = "";
          headerSlot.classList.remove("direct-ad-slot--minimized", "dismissed");
          headerSlot.classList.add("plexus-header-slot");
          headerContent.innerHTML = headerMarkup;
        }

        const feed = doc.getElementById("alertsContainer");
        if (!feed) return;
        if (!feed.querySelector(".sample-seed-group")) {
          const seeds = seedAlerts();
          if (seeds) {
            const section = doc.createElement("section");
            section.className = "alert-group sample-seed-group";
            section.innerHTML = '<div class="alert-group-heading"><span>Sample alerts</span><strong>Ad placement preview</strong></div><div class="alert-group-grid"></div>';
            const seedGrid = section.querySelector(".alert-group-grid");
            seeds.forEach((alert,index) => seedGrid.appendChild(frame.contentWindow.buildCard(alert,index)));
            feed.appendChild(section);
          }
        }

        const slots = [...feed.querySelectorAll(".ad-slot-in-feed")];
        let sampleSlot = slots.find((slot) => slot.querySelector(".amp-sample-feed"));
        if (!sampleSlot) sampleSlot = slots[0];
        if (sampleSlot) {
          slots.filter((slot) => slot !== sampleSlot).forEach((slot) => { slot.hidden = true; });
          if (!sampleSlot.querySelector(".amp-sample-feed")) {
            sampleSlot.hidden = false;
            sampleSlot.classList.remove("ad-slot-empty");
            sampleSlot.classList.add("plexus-infeed-slot");
            sampleSlot.innerHTML = feedMarkup;
          }
          return;
        }

        const cards = feed.querySelectorAll(".alert-card");
        if (cards.length < 2 || feed.querySelector(".amp-sample-feed")) return;
        const seedCards = feed.querySelectorAll(".sample-seed-group .alert-card");
        const secondCard = seedCards[1] || cards[1];
        const grid = secondCard.closest(".alert-group-grid");
        if (!grid) return;
        const slot = doc.createElement("div");
        slot.className = "ad-slot ad-slot-in-feed alert-inline-ad plexus-infeed-slot";
        slot.setAttribute("aria-label", "Sponsored advertisement");
        slot.innerHTML = feedMarkup;
        secondCard.after(slot);
      };

      const addChatPointer = () => {
        const doc = frame.contentDocument;
        const discussion = doc?.querySelector(".sample-seed-group .alert-card .card-disc-inline-btn");
        if (!discussion || discussion.parentElement.querySelector(".amp-discussion-pointer")) return;
        const pointer = doc.createElement("span");
        pointer.className = "amp-discussion-pointer";
        pointer.textContent = "Click here to see chat ad ↓";
        discussion.before(pointer);
      };

      const applyChatSampleAd = () => {
        const doc = frame.contentDocument;
        const messages = doc?.getElementById("alertDiscMessages");
        if (!messages || messages.querySelector(".amp-sample-chat")) return;
        messages.querySelectorAll("[data-alert-chat-ad]").forEach((node) => node.remove());
        const holder = doc.createElement("div");
        holder.innerHTML = chatMarkup;
        const ad = holder.firstElementChild;
        const firstMessage = messages.querySelector(".sc-comm-msg:not(.sc-comm-sponsored-msg)");
        if (firstMessage) firstMessage.after(ad);
        else messages.appendChild(ad);
      };

      frame.addEventListener("load", () => {
        applySampleAds();
        applyChatSampleAd();
        const doc = frame.contentDocument;
        if (doc?.body) new MutationObserver(() => { applySampleAds(); addChatPointer(); applyChatSampleAd(); }).observe(doc.body, {childList:true,subtree:true});
        const retryTimer = window.setInterval(() => { applySampleAds(); addChatPointer(); applyChatSampleAd(); }, 800);
        window.setTimeout(() => window.clearInterval(retryTimer), 30000);
      });
    })();
  </script>
</body>
</html>
